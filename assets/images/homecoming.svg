<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mascotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1240"/>
      <stop offset="50%" stop-color="#4e286d"/>
      <stop offset="100%" stop-color="#180b26"/>
    </linearGradient>
    <linearGradient id="goldHelm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="40%" stop-color="#e1b12c"/>
      <stop offset="80%" stop-color="#c28c11"/>
      <stop offset="100%" stop-color="#7f5a04"/>
    </linearGradient>
    <linearGradient id="purpleArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7d449e"/>
      <stop offset="70%" stop-color="#4e286d"/>
      <stop offset="100%" stop-color="#2c1440"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" fill="url(#mascotBg)"/>

  <!-- Confetti / Stadium cheering vibe -->
  <circle cx="20" cy="20" r="2.5" fill="#f1c40f" opacity="0.6"/>
  <circle cx="100" cy="25" r="3" fill="#e056fd" opacity="0.5"/>
  <circle cx="15" cy="85" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="105" cy="80" r="2.5" fill="#f1c40f" opacity="0.6"/>

  <!-- Body / Armor -->
  <path d="M 25,120 L 32,95 L 48,90 L 72,90 L 88,95 L 95,120 Z" fill="url(#purpleArmor)"/>
  <!-- Gold Gorget Collar -->
  <path d="M 40,92 Q 60,105 80,92 L 76,99 Q 60,110 44,99 Z" fill="url(#goldHelm)"/>

  <!-- Head / Face -->
  <rect x="42" y="48" width="36" height="34" rx="10" fill="#f3c69d"/>
  
  <!-- Saxon Warrior Mustache & Beard -->
  <path d="M 38,68 C 42,88 52,94 60,95 C 68,94 78,88 82,68 C 76,74 68,76 60,74 C 52,76 44,74 38,68 Z" fill="#9e6628"/>
  <path d="M 44,65 Q 60,72 76,65 Q 60,78 44,65 Z" fill="#6d4213"/>

  <!-- Eyes & Eyebrows -->
  <path d="M 46,55 Q 52,53 56,57" stroke="#331d0c" stroke-width="2.5" fill="none"/>
  <path d="M 64,57 Q 68,53 74,55" stroke="#331d0c" stroke-width="2.5" fill="none"/>
  <circle cx="51" cy="60" r="2.5" fill="#2d1d0c"/>
  <circle cx="69" cy="60" r="2.5" fill="#2d1d0c"/>

  <!-- Saxon Spangenhelm Helmet -->
  <path d="M 34,48 C 34,22 45,14 60,14 C 75,14 86,22 86,48 Z" fill="url(#goldHelm)"/>
  <!-- Helmet Brow Band -->
  <rect x="32" y="45" width="56" height="8" rx="2" fill="#9e6d08"/>
  <line x1="32" y1="49" x2="88" y2="49" stroke="#ffeaa7" stroke-width="1.5"/>

  <!-- Helmet Center Ridge / Nasal Guard -->
  <path d="M 57,14 L 63,14 L 63,62 L 57,62 Z" fill="#b88310"/>
  <path d="M 58,14 L 62,14 L 62,61 L 58,61 Z" fill="#ffeaa7"/>

  <!-- Saxon Horns / Wings -->
  <path d="M 36,36 C 24,30 18,16 20,8 C 26,14 30,22 36,28 Z" fill="#fdfbf7"/>
  <path d="M 84,36 C 96,30 102,16 100,8 C 94,14 90,22 84,28 Z" fill="#fdfbf7"/>
  <!-- Horn gold mount -->
  <circle cx="36" cy="33" r="4" fill="#e1b12c"/>
  <circle cx="84" cy="33" r="4" fill="#e1b12c"/>
</svg>
