<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="gradWalkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c1017"/>
      <stop offset="100%" stop-color="#1a070a"/>
    </linearGradient>
    <linearGradient id="colonnadeStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a423a"/>
      <stop offset="50%" stop-color="#806256"/>
      <stop offset="100%" stop-color="#44312b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#gradWalkBg)"/>

  <!-- Colonnade Archway Pillars (Right to Left Perspective) -->
  <rect x="50" y="40" width="30" height="260" fill="url(#colonnadeStone)"/>
  <rect x="180" y="40" width="30" height="260" fill="url(#colonnadeStone)"/>
  <rect x="310" y="40" width="30" height="260" fill="url(#colonnadeStone)"/>
  <rect x="440" y="40" width="30" height="260" fill="url(#colonnadeStone)"/>
  <rect x="560" y="40" width="30" height="260" fill="url(#colonnadeStone)"/>

  <!-- Arch Headers -->
  <path d="M 50,70 Q 115,10 180,70 L 180,40 L 50,40 Z" fill="#6d544b"/>
  <path d="M 180,70 Q 245,10 310,70 L 310,40 L 180,40 Z" fill="#6d544b"/>
  <path d="M 310,70 Q 375,10 440,70 L 440,40 L 310,40 Z" fill="#6d544b"/>
  <path d="M 440,70 Q 500,10 560,70 L 560,40 L 440,40 Z" fill="#6d544b"/>

  <!-- Graduates walking in robes (seen from back / angle) -->
  <!-- Grad 1 -->
  <g transform="translate(100, 100)">
    <!-- Mortarboard Cap -->
    <polygon points="40,25 60,18 80,25 60,32" fill="#0d1b2a"/>
    <circle cx="60" cy="25" r="3" fill="#ffd166"/>
    <line x1="60" y1="25" x2="75" y2="35" stroke="#ffd166" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="60" cy="40" r="14" fill="#fcd34d"/>
    <!-- Navy Blue Gown Robe with Stole -->
    <path d="M 35,180 L 45,55 L 75,55 L 85,180 Z" fill="#0d2540"/>
    <path d="M 48,55 L 60,120 L 72,55 Z" fill="#a01a32"/>
  </g>

  <!-- Grad 2 -->
  <g transform="translate(210, 105)">
    <polygon points="40,25 60,18 80,25 60,32" fill="#0d1b2a"/>
    <circle cx="60" cy="25" r="3" fill="#ffd166"/>
    <line x1="60" y1="25" x2="75" y2="35" stroke="#ffd166" stroke-width="1.5"/>
    <circle cx="60" cy="40" r="14" fill="#fcd34d"/>
    <path d="M 35,180 L 45,55 L 75,55 L 85,180 Z" fill="#0d2540"/>
    <path d="M 48,55 L 60,120 L 72,55 Z" fill="#ffd166"/>
  </g>

  <!-- Grad 3 -->
  <g transform="translate(320, 100)">
    <polygon points="40,25 60,18 80,25 60,32" fill="#0d1b2a"/>
    <circle cx="60" cy="25" r="3" fill="#ffd166"/>
    <line x1="60" y1="25" x2="75" y2="35" stroke="#ffd166" stroke-width="1.5"/>
    <circle cx="60" cy="40" r="14" fill="#fcd34d"/>
    <path d="M 35,180 L 45,55 L 75,55 L 85,180 Z" fill="#0d2540"/>
    <path d="M 48,55 L 60,120 L 72,55 Z" fill="#a01a32"/>
  </g>

  <!-- Grad 4 -->
  <g transform="translate(430, 105)">
    <polygon points="40,25 60,18 80,25 60,32" fill="#0d1b2a"/>
    <circle cx="60" cy="25" r="3" fill="#ffd166"/>
    <line x1="60" y1="25" x2="75" y2="35" stroke="#ffd166" stroke-width="1.5"/>
    <circle cx="60" cy="40" r="14" fill="#fcd34d"/>
    <path d="M 35,180 L 45,55 L 75,55 L 85,180 Z" fill="#0d2540"/>
    <path d="M 48,55 L 60,120 L 72,55 Z" fill="#2563eb"/>
  </g>
</svg>
