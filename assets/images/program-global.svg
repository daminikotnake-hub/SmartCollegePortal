<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="globalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a221b"/>
      <stop offset="50%" stop-color="#7c3327"/>
      <stop offset="100%" stop-color="#2c1410"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#globalBg)"/>
  <!-- World Map Globe Lines -->
  <circle cx="200" cy="150" r="90" fill="none" stroke="#fed7aa" stroke-width="2" opacity="0.4"/>
  <ellipse cx="200" cy="150" rx="45" ry="90" fill="none" stroke="#fed7aa" stroke-width="1.5" opacity="0.4"/>
  <line x1="110" y1="150" x2="290" y2="150" stroke="#fed7aa" stroke-width="1.5" opacity="0.4"/>
  <line x1="130" y1="100" x2="270" y2="100" stroke="#fed7aa" stroke-width="1.5" opacity="0.3"/>
  <line x1="130" y1="200" x2="270" y2="200" stroke="#fed7aa" stroke-width="1.5" opacity="0.3"/>
  <!-- Historic clocktower building silhouette in autumn -->
  <polygon points="175,250 200,90 225,250" fill="#a01a32"/>
  <rect x="185" y="140" width="30" height="110" fill="#a01a32"/>
  <circle cx="200" cy="170" r="8" fill="#ffedd5"/>
</svg>
