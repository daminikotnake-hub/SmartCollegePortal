<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crestShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a01a32"/>
      <stop offset="50%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#4a0012"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#e6b800"/>
      <stop offset="100%" stop-color="#b38f00"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M 50,5 C 80,5 92,12 92,38 C 92,68 68,88 50,96 C 32,88 8,68 8,38 C 8,12 20,5 50,5 Z" 
        fill="url(#crestShield)" stroke="url(#goldAccent)" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Inner Shield Trim -->
  <path d="M 50,11 C 74,11 84,17 84,38 C 84,63 64,80 50,88 C 36,80 16,63 16,38 C 16,17 26,11 50,11 Z" 
        fill="none" stroke="url(#goldAccent)" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Radiant Star / Sun of Knowledge -->
  <circle cx="50" cy="25" r="7" fill="url(#goldAccent)"/>
  <path d="M 50,14 L 50,36 M 39,25 L 61,25 M 42,17 L 58,33 M 42,33 L 58,17" 
        stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Open Book of Wisdom -->
  <g transform="translate(26, 38) scale(0.48)" fill="#ffffff" stroke="url(#goldAccent)" stroke-width="2">
    <path d="M 50,45 C 40,32 20,32 5,36 L 5,75 C 20,70 38,70 50,82 C 62,70 80,70 95,75 L 95,36 C 80,32 60,32 50,45 Z" fill="#fffdfa"/>
    <line x1="50" y1="45" x2="50" y2="82" stroke="#800020" stroke-width="2"/>
    <!-- Lines of Text in Book -->
    <line x1="16" y1="48" x2="42" y2="48" stroke="#800020" stroke-width="1.5"/>
    <line x1="16" y1="56" x2="42" y2="56" stroke="#800020" stroke-width="1.5"/>
    <line x1="16" y1="64" x2="38" y2="64" stroke="#800020" stroke-width="1.5"/>
    <line x1="58" y1="48" x2="84" y2="48" stroke="#800020" stroke-width="1.5"/>
    <line x1="58" y1="56" x2="84" y2="56" stroke="#800020" stroke-width="1.5"/>
    <line x1="58" y1="64" x2="80" y2="64" stroke="#800020" stroke-width="1.5"/>
  </g>

  <!-- Torch / Flame -->
  <path d="M 48,72 L 52,72 L 51,82 L 49,82 Z" fill="url(#goldAccent)"/>
  <path d="M 50,68 C 47,65 47,60 50,56 C 53,60 53,65 50,68 Z" fill="#ffd56b"/>
</svg>
