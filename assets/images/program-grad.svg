<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2d27"/>
      <stop offset="60%" stop-color="#543e33"/>
      <stop offset="100%" stop-color="#241a15"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#gradBg)"/>
  <!-- Library bookshelf arched backdrop -->
  <g fill="#785947" opacity="0.65">
    <rect x="30" y="20" width="60" height="260" rx="3"/>
    <rect x="100" y="20" width="60" height="260" rx="3"/>
    <rect x="170" y="20" width="60" height="260" rx="3"/>
    <rect x="240" y="20" width="60" height="260" rx="3"/>
    <rect x="310" y="20" width="60" height="260" rx="3"/>
  </g>
  <!-- Book rows in different colors -->
  <g fill="#a01a32">
    <rect x="35" y="40" width="50" height="15" rx="2"/>
    <rect x="105" y="65" width="50" height="15" rx="2"/>
    <rect x="175" y="90" width="50" height="15" rx="2"/>
  </g>
  <g fill="#e5e7eb" opacity="0.8">
    <rect x="35" y="80" width="50" height="15" rx="2"/>
    <rect x="245" y="50" width="50" height="15" rx="2"/>
    <rect x="315" y="75" width="50" height="15" rx="2"/>
  </g>
  <!-- Research Scholar Silhouette -->
  <circle cx="200" cy="190" r="32" fill="#e5e7eb"/>
  <path d="M 150,290 C 150,240 170,230 200,230 C 230,230 250,240 250,290 Z" fill="#800020"/>
  <!-- Laptop on desk -->
  <rect x="160" y="260" width="80" height="10" rx="2" fill="#cbd5e1"/>
  <polygon points="175,225 225,225 240,260 160,260" fill="#f8fafc" opacity="0.9"/>
</svg>
