<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="textCircle" d="M 250, 250 m -195, 0 a 195,195 0 1,1 390,0 a 195,195 0 1,1 -390,0" />
    <path id="textCircleInner" d="M 250, 250 m -145, 0 a 145,145 0 1,1 290,0 a 145,145 0 1,1 -290,0" />
  </defs>
  <circle cx="250" cy="250" r="240" fill="url(#sealGlow)"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="3,3"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Radiating Sun Rays in center -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25">
    <line x1="250" y1="95" x2="250" y2="160" />
    <line x1="250" y1="340" x2="250" y2="405" />
    <line x1="95" y1="250" x2="160" y2="250" />
    <line x1="340" y1="250" x2="405" y2="250" />
    <line x1="140" y1="140" x2="186" y2="186" />
    <line x1="360" y1="360" x2="314" y2="314" />
    <line x1="360" y1="140" x2="314" y2="186" />
    <line x1="140" y1="360" x2="186" y2="314" />
    <line x1="200" y1="108" x2="218" y2="164" />
    <line x1="300" y1="108" x2="282" y2="164" />
    <line x1="200" y1="392" x2="218" y2="336" />
    <line x1="300" y1="392" x2="282" y2="336" />
    <line x1="108" y1="200" x2="164" y2="218" />
    <line x1="108" y1="300" x2="164" y2="282" />
    <line x1="392" y1="200" x2="336" y2="218" />
    <line x1="392" y1="300" x2="336" y2="282" />
  </g>

  <!-- Circular Text -->
  <text fill="#ffffff" fill-opacity="0.4" font-family="'Cinzel', 'Times New Roman', serif" font-size="21" font-weight="bold" letter-spacing="4">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      ★ ALFRED UNIVERSITY • FOUNDED 1836 ★
    </textPath>
  </text>
  
  <text fill="#ffffff" fill-opacity="0.35" font-family="'Cinzel', 'Times New Roman', serif" font-size="16" font-weight="bold" letter-spacing="6">
    <textPath href="#textCircleInner" startOffset="50%" text-anchor="middle">
      FIAT LUX • LET THERE BE LIGHT
    </textPath>
  </text>

  <!-- Central Shield / Open Book Icon -->
  <g transform="translate(190, 190) scale(1.2)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.45" stroke-linejoin="round" stroke-linecap="round">
    <!-- Open Book -->
    <path d="M 50,45 C 40,35 25,35 5,38 L 5,75 C 25,72 40,72 50,82 C 60,72 75,72 95,75 L 95,38 C 75,35 60,35 50,45 Z" fill="#ffffff" fill-opacity="0.08"/>
    <line x1="50" y1="45" x2="50" y2="82" />
    <!-- Torch -->
    <path d="M 50,15 L 45,35 L 55,35 Z" fill="#ffffff" fill-opacity="0.3"/>
    <path d="M 43,15 Q 50,3 57,15 Q 50,8 43,15 Z" fill="#ffd166" fill-opacity="0.4"/>
  </g>

  <!-- Stars & Laurel Leaves -->
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="250" cy="52" r="4"/>
    <circle cx="250" cy="448" r="4"/>
    <circle cx="52" cy="250" r="4"/>
    <circle cx="448" cy="250" r="4"/>
  </g>
</svg>
