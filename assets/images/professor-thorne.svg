<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 420" width="350" height="420">
  <defs>
    <linearGradient id="chalkboardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4d3e"/>
      <stop offset="100%" stop-color="#12352b"/>
    </linearGradient>
    <linearGradient id="vestBeige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9dfd0"/>
      <stop offset="100%" stop-color="#c9bcab"/>
    </linearGradient>
  </defs>

  <!-- Green Classroom Blackboard Background -->
  <rect width="350" height="420" fill="url(#chalkboardBg)"/>
  
  <!-- Faint Chalk Equations on board -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.3" fill="none">
    <path d="M 30,50 Q 50,30 70,50 T 110,50"/>
    <text x="30" y="90" font-family="monospace" font-size="14" fill="#fff" stroke="none">f(x) = ∫ e^(-t²) dt</text>
    <text x="30" y="125" font-family="monospace" font-size="14" fill="#fff" stroke="none">ΔH = Σ E(reactants) - Σ E(prod)</text>
    <circle cx="280" cy="80" r="30"/>
    <line x1="280" y1="50" x2="280" y2="110"/>
    <line x1="250" y1="80" x2="310" y2="80"/>
  </g>

  <!-- Distinguished Professor Figure -->
  <!-- Shoulders / Arms -->
  <path d="M 60,420 L 90,260 L 140,240 L 210,240 L 260,260 L 290,420 Z" fill="#2d3748"/>
  <!-- Light beige sweater vest -->
  <path d="M 125,245 L 175,320 L 225,245 L 235,420 L 115,420 Z" fill="url(#vestBeige)"/>
  <!-- White Collared Shirt -->
  <polygon points="140,240 175,290 210,240" fill="#ffffff"/>
  <polygon points="170,265 175,280 180,265" fill="#a01a32"/>

  <!-- Neck -->
  <rect x="155" y="195" width="40" height="50" rx="8" fill="#fcd7bd"/>

  <!-- Head -->
  <ellipse cx="175" cy="155" rx="36" ry="46" fill="#fce2cd"/>

  <!-- White / Grey Hair -->
  <path d="M 132,150 C 130,105 150,90 175,90 C 200,90 220,105 218,150 C 218,125 205,108 175,108 C 145,108 132,125 132,150 Z" fill="#e2e8f0"/>
  <path d="M 133,145 C 130,170 135,185 142,190 C 139,180 137,165 140,150 Z" fill="#cbd5e1"/>
  <path d="M 217,145 C 220,170 215,185 208,190 C 211,180 213,165 210,150 Z" fill="#cbd5e1"/>

  <!-- Eyebrows -->
  <path d="M 150,140 Q 160,135 168,140" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <path d="M 182,140 Q 190,135 200,140" stroke="#94a3b8" stroke-width="2.5" fill="none"/>

  <!-- Glasses -->
  <rect x="146" y="142" width="24" height="18" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
  <rect x="180" y="142" width="24" height="18" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="170" y1="150" x2="180" y2="150" stroke="#475569" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="158" cy="151" r="2.5" fill="#1e293b"/>
  <circle cx="192" cy="151" r="2.5" fill="#1e293b"/>

  <!-- Nose -->
  <path d="M 175,150 L 173,170 L 178,170" stroke="#d59b79" stroke-width="2" fill="none"/>

  <!-- Smile & Expression -->
  <path d="M 162,182 Q 175,190 188,182" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
