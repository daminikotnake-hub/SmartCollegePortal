<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="cloudySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#768a9b"/>
      <stop offset="45%" stop-color="#9ab3c6"/>
      <stop offset="100%" stop-color="#cfdde8"/>
    </linearGradient>
    <linearGradient id="neoclassicalStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73665a"/>
      <stop offset="35%" stop-color="#968779"/>
      <stop offset="70%" stop-color="#807264"/>
      <stop offset="100%" stop-color="#64574a"/>
    </linearGradient>
    <linearGradient id="lawnQuad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#559938"/>
      <stop offset="100%" stop-color="#3c7324"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="480" fill="url(#cloudySky)"/>

  <!-- Left Quadrangle Wing (Perspective Angle) -->
  <polygon points="50,180 280,240 280,380 50,420" fill="url(#neoclassicalStone)"/>
  
  <!-- Right Quadrangle Wing (Perspective Angle) -->
  <polygon points="850,180 620,240 620,380 850,420" fill="url(#neoclassicalStone)"/>

  <!-- Main Center Quadrangle Facade -->
  <rect x="270" y="220" width="360" height="150" fill="url(#neoclassicalStone)"/>
  <polygon points="260,220 450,180 640,220" fill="#4d433b"/>

  <!-- Colonnade & Arched Windows (Center) -->
  <g fill="#212121">
    <rect x="310" y="250" width="16" height="35" rx="8"/>
    <rect x="350" y="250" width="16" height="35" rx="8"/>
    <rect x="390" y="250" width="16" height="35" rx="8"/>
    <rect x="430" y="250" width="16" height="35" rx="8"/>
    <rect x="470" y="250" width="16" height="35" rx="8"/>
    <rect x="510" y="250" width="16" height="35" rx="8"/>
    <rect x="550" y="250" width="16" height="35" rx="8"/>

    <rect x="310" y="305" width="16" height="35" rx="8"/>
    <rect x="350" y="305" width="16" height="35" rx="8"/>
    <rect x="390" y="305" width="16" height="35" rx="8"/>
    <rect x="430" y="305" width="16" height="35" rx="8"/>
    <rect x="470" y="305" width="16" height="35" rx="8"/>
    <rect x="510" y="305" width="16" height="35" rx="8"/>
    <rect x="550" y="305" width="16" height="35" rx="8"/>
    
    <!-- Central Grand Entrance Portal -->
    <path d="M 430,325 Q 450,305 470,325 L 470,370 L 430,370 Z"/>
  </g>

  <!-- Left Colonnade Rows (Perspective) -->
  <g fill="#26231f">
    <polygon points="80,240 100,245 100,280 80,275"/>
    <polygon points="120,250 140,255 140,290 120,285"/>
    <polygon points="160,260 180,265 180,300 160,295"/>
    <polygon points="200,270 220,275 220,310 200,305"/>

    <polygon points="80,300 100,305 100,345 80,340"/>
    <polygon points="120,310 140,315 140,355 120,350"/>
    <polygon points="160,320 180,325 180,365 160,360"/>
    <polygon points="200,330 220,335 220,375 200,370"/>
  </g>

  <!-- Right Colonnade Rows (Perspective) -->
  <g fill="#26231f">
    <polygon points="820,240 800,245 800,280 820,275"/>
    <polygon points="780,250 760,255 760,290 780,285"/>
    <polygon points="740,260 720,265 720,300 740,295"/>
    <polygon points="700,270 680,275 680,310 700,305"/>

    <polygon points="820,300 800,305 800,345 820,340"/>
    <polygon points="780,310 760,315 760,355 780,350"/>
    <polygon points="740,320 720,325 720,365 740,360"/>
    <polygon points="700,330 680,335 680,375 700,370"/>
  </g>

  <!-- Central Great Quadrangle Courtyard Lawn -->
  <polygon points="270,370 630,370 850,480 50,480" fill="url(#lawnQuad)"/>
  
  <!-- Symmetric Stone Borders of Courtyard -->
  <polygon points="255,370 270,370 50,480 30,480" fill="#a89d8f"/>
  <polygon points="630,370 645,370 870,480 850,480" fill="#a89d8f"/>
</svg>
