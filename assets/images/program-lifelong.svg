      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#lifeBg)"/>
  <!-- Collaborative workshop circle -->
  <circle cx="200" cy="150" r="110" fill="#334155" opacity="0.3"/>
  <circle cx="200" cy="150" r="70" fill="#475569" opacity="0.4"/>
