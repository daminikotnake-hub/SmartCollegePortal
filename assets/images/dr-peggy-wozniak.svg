<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="portraitBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e3eaf2"/>
      <stop offset="100%" stop-color="#bac9d9"/>
    </radialGradient>
    <linearGradient id="hairSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e286d"/>
      <stop offset="100%" stop-color="#2a1240"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <rect width="120" height="120" fill="url(#portraitBg)"/>

    <!-- Blazer / Shoulders -->
    <path d="M 15,120 L 26,88 L 48,82 L 72,82 L 94,88 L 105,120 Z" fill="url(#blazer)"/>
    <!-- Blouse / Inner Collar -->
    <path d="M 48,82 L 60,105 L 72,82 Z" fill="#ffffff"/>
    <path d="M 52,86 L 60,98 L 68,86 Z" fill="#f8fafc"/>
    <circle cx="60" cy="92" r="2" fill="#ffd166"/>

    <!-- Neck -->
    <rect x="52" y="65" width="16" height="20" rx="4" fill="#fcd7bd"/>
    <!-- Shadow beneath chin -->
    <ellipse cx="60" cy="70" rx="9" ry="3" fill="#e2b496"/>

    <!-- Face -->
    <ellipse cx="60" cy="50" rx="20" ry="24" fill="#fce2cd"/>

    <!-- Cheeks warmth -->
    <circle cx="48" cy="54" r="5" fill="#f8b4a0" opacity="0.4"/>
    <circle cx="72" cy="54" r="5" fill="#f8b4a0" opacity="0.4"/>

    <!-- Silver Styled Short Hair -->
    <path d="M 36,44 C 34,22 46,14 60,14 C 74,14 86,22 84,44 C 84,32 78,24 60,24 C 42,24 36,32 36,44 Z" fill="url(#hairSilver)"/>
    <path d="M 37,38 C 34,48 36,60 41,64 C 40,56 42,48 44,42 Z" fill="url(#hairSilver)"/>
    <path d="M 83,38 C 86,48 84,60 79,64 C 80,56 78,48 76,42 Z" fill="url(#hairSilver)"/>
    <!-- Soft hair highlights -->
    <path d="M 45,22 Q 60,18 75,22" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 42,30 Q 56,26 68,30" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Eyebrows -->
    <path d="M 46,41 Q 52,38 56,41" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M 64,41 Q 68,38 74,41" stroke="#94a3b8" stroke-width="2" fill="none"/>

    <!-- Eyes (Warm & Smiling) -->
    <path d="M 47,46 Q 51,43 55,46" stroke="#475569" stroke-width="2" fill="none"/>
    <path d="M 65,46 Q 69,43 73,46" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="51" cy="46.5" r="2" fill="#2d3748"/>
    <circle cx="69" cy="46.5" r="2" fill="#2d3748"/>
    <circle cx="51.5" cy="45.5" r="0.6" fill="#fff"/>
    <circle cx="69.5" cy="45.5" r="0.6" fill="#fff"/>

    <!-- Reading Glasses (Subtle Chic) -->
    <ellipse cx="51" cy="46" rx="6" ry="4.5" fill="none" stroke="#718096" stroke-width="1.2"/>
    <ellipse cx="69" cy="46" rx="6" ry="4.5" fill="none" stroke="#718096" stroke-width="1.2"/>
    <line x1="57" y1="45" x2="63" y2="45" stroke="#718096" stroke-width="1.2"/>

    <!-- Nose -->
    <path d="M 60,45 L 59,55 L 62,55" stroke="#d59b79" stroke-width="1.8" fill="none"/>

    <!-- Warm Generous Smile -->
    <path d="M 52,60 Q 60,67 68,60" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 54,60 Q 60,63 66,60" fill="#ffffff"/>
  </g>

  <!-- Circular Outer Border -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#4e286d" stroke-width="3"/>
</svg>
