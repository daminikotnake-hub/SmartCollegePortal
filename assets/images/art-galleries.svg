<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6572"/>
      <stop offset="60%" stop-color="#8ba3b2"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <linearGradient id="buildingStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="50%" stop-color="#dfcca9"/>
      <stop offset="100%" stop-color="#c4b08b"/>
    </linearGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="40%" stop-color="#546e7a"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="120" height="120" fill="url(#skyGrad)"/>

  <!-- Background hills/trees -->
  <path d="M 0,85 Q 35,68 70,80 T 120,75 L 120,120 L 0,120 Z" fill="#4d5a44" opacity="0.6"/>

  <!-- Modern Art Gallery Building (Harder Hall) -->
  <rect x="25" y="32" width="70" height="74" fill="url(#glassWall)" rx="1"/>

  <!-- Vertical Terra Cotta / Ceramic Louvers (Signature AU Ceramic Architecture) -->
  <g fill="url(#buildingStone)">
    <rect x="27" y="30" width="5" height="76"/>
    <rect x="36" y="30" width="5" height="76"/>
    <rect x="45" y="30" width="5" height="76"/>
    <rect x="54" y="30" width="5" height="76"/>
    <rect x="63" y="30" width="5" height="76"/>
    <rect x="72" y="30" width="5" height="76"/>
    <rect x="81" y="30" width="5" height="76"/>
    <rect x="90" y="30" width="5" height="76"/>
  </g>

  <!-- Horizontal Roofline & Floor Slabs -->
  <rect x="23" y="27" width="74" height="5" fill="#2c3e50"/>
  <rect x="25" y="65" width="70" height="3" fill="#37474f"/>
  <rect x="22" y="104" width="76" height="6" fill="#263238"/>

  <!-- Interior Warm Art Gallery Illumination showing through glass slats -->
  <g fill="#ffeaa7" opacity="0.45">
    <rect x="32" y="36" width="4" height="26"/>
    <rect x="41" y="36" width="4" height="26"/>
    <rect x="50" y="36" width="4" height="26"/>
    <rect x="59" y="36" width="4" height="26"/>
    <rect x="68" y="36" width="4" height="26"/>
    <rect x="77" y="36" width="4" height="26"/>
    <rect x="86" y="36" width="4" height="26"/>
    
    <rect x="32" y="72" width="4" height="28"/>
    <rect x="41" y="72" width="4" height="28"/>
    <rect x="50" y="72" width="4" height="28"/>
    <rect x="59" y="72" width="4" height="28"/>
    <rect x="68" y="72" width="4" height="28"/>
    <rect x="77" y="72" width="4" height="28"/>
    <rect x="86" y="72" width="4" height="28"/>
  </g>

  <!-- Plaza Ground & Greenery -->
  <rect x="0" y="108" width="120" height="12" fill="#78909c"/>
  <path d="M 0,113 L 120,113" stroke="#b0bec5" stroke-width="1.5"/>
  <ellipse cx="14" cy="110" rx="9" ry="6" fill="#33691e"/>
  <ellipse cx="106" cy="110" rx="9" ry="6" fill="#33691e"/>
</svg>
