<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bustBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b24"/>
      <stop offset="50%" stop-color="#5a4238"/>
      <stop offset="100%" stop-color="#2a1d18"/>
    </linearGradient>
    <linearGradient id="marble" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="40%" stop-color="#ebd8c3"/>
      <stop offset="80%" stop-color="#bba38a"/>
      <stop offset="100%" stop-color="#8c735d"/>
    </linearGradient>
    <linearGradient id="beard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2d2be"/>
      <stop offset="100%" stop-color="#9a816c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" fill="url(#bustBg)"/>
  
  <!-- Pedestal base -->
  <path d="M 30,112 L 90,112 L 85,102 L 35,102 Z" fill="#6d5444"/>
  <rect x="25" y="112" width="70" height="8" rx="2" fill="#4d3a2e"/>

  <!-- Bust Shoulders / Robe -->
  <path d="M 24,98 C 24,80 38,72 50,70 C 55,70 65,70 70,70 C 82,72 96,80 96,98 L 86,102 C 75,95 65,96 55,96 C 45,96 35,95 24,102 Z" fill="url(#marble)"/>
  
  <!-- Robe folds -->
  <path d="M 38,82 Q 52,94 56,102" stroke="#684f3c" stroke-width="2.5" fill="none"/>
  <path d="M 82,82 Q 68,94 64,102" stroke="#684f3c" stroke-width="2.5" fill="none"/>

  <!-- Neck -->
  <path d="M 50,62 L 70,62 L 68,74 L 52,74 Z" fill="url(#marble)"/>

  <!-- Head / Face Profile / Frontal -->
  <ellipse cx="60" cy="46" rx="19" ry="24" fill="url(#marble)"/>
  
  <!-- Classical Hair curls -->
  <path d="M 40,40 C 38,24 50,18 60,18 C 70,18 82,24 80,40 C 76,26 68,23 60,24 C 52,23 44,26 40,40 Z" fill="#9e856e"/>
  <circle cx="43" cy="30" r="5" fill="#ab9178"/>
  <circle cx="53" cy="22" r="5" fill="#ab9178"/>
  <circle cx="67" cy="22" r="5" fill="#ab9178"/>
  <circle cx="77" cy="30" r="5" fill="#ab9178"/>

  <!-- Features -->
  <!-- Forehead highlight -->
  <path d="M 50,32 Q 60,29 70,32" stroke="#fff" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Eyes & Brow -->
  <path d="M 47,40 Q 52,38 56,41" stroke="#5d4636" stroke-width="2" fill="none"/>
  <path d="M 64,41 Q 68,38 73,40" stroke="#5d4636" stroke-width="2" fill="none"/>
  <ellipse cx="52" cy="43" rx="2" ry="1.5" fill="#5d4636"/>
  <ellipse cx="68" cy="43" rx="2" ry="1.5" fill="#5d4636"/>

  <!-- Nose -->
  <path d="M 60,40 L 59,52 L 63,52" stroke="#6a4e3a" stroke-width="2" fill="none"/>

  <!-- Full Classical Philosopher Beard & Mustache -->
  <path d="M 52,55 Q 60,57 68,55 Q 60,63 52,55 Z" fill="url(#beard)"/>
  <path d="M 44,52 C 44,78 52,86 60,88 C 68,86 76,78 76,52 C 73,66 67,76 60,78 C 53,76 47,66 44,52 Z" fill="url(#beard)"/>
  <path d="M 55,68 Q 60,82 65,68" stroke="#8c735d" stroke-width="1.5" fill="none"/>
  <path d="M 50,60 Q 52,75 56,76" stroke="#8c735d" stroke-width="1" fill="none"/>
  <path d="M 70,60 Q 68,75 64,76" stroke="#8c735d" stroke-width="1" fill="none"/>
</svg>
